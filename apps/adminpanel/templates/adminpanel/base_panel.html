
{% extends "base.html" %}
{% load static %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2b2b2b;">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'panel_index' %}">
            <i class="bi bi-speedometer2"></i> Панель управления
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#panelNav" aria-controls="panelNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="panelNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-1" href="{% url 'new_item' 'auto' %}">
                        <i class="bi bi-car-front-fill"></i> Добавить авто
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-1" href="{% url 'new_item' 'moto' %}">
                        <i class="bi bi-bicycle"></i> Добавить мото
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-1" href="{% url 'new_item' 'wheel' %}">
                        <i class="bi bi-disc"></i> Добавить колёса
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-1" href="{% url 'index' %}">
                        <i class="bi bi-shop"></i> Каталог
                    </a>
                </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/logout/">Выйти</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
{% endblock %}
